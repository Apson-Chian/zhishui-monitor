# Zhishui standalone static site. Managed by deploy/install-server.py.
location = /zhishui {
    return 301 /zhishui/;
}

location = /zhishui/api/vision {
    limit_except POST { deny all; }
    client_max_body_size 3m;
    client_body_buffer_size 3m;
    client_body_timeout 15s;
    proxy_pass http://127.0.0.1:5192;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 80s;
    proxy_connect_timeout 3s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

location = /zhishui/api/vision/health {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:5192;
    add_header Cache-Control "no-store" always;
}

location ^~ /zhishui/ {
    alias /var/www/zhishui/current/;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
