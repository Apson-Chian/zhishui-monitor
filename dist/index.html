          <p class="opening-theme">以水为媒·读懂河海</p>
          <p>水，是金陵绵延的脉络。水波起落之间，藏着自然的讯息。智水监测以数字为眸，捕捉水情脉动，让沉默的江河，拥有可能被读懂的语言。我们用科技搭建与河湖对话的桥梁，以数字力量守护一方清波，让金陵的河湖澄澈常在，诗意流水生生不息。</p>
